apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: inference-gateway
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/inference-dev/gateway
    newTag: REPLACE_WITH_UNIQUE_BUILD_TAG
  - name: mock-vllm
    newName: vllm/vllm-openai
    newTag: v0.8.5

configMapGenerator:
  - name: inference-gateway-config
    namespace: inference
    behavior: replace
    files:
      - config.yaml=gateway-config.yaml

patches:
  - path: worker-patch.yaml
