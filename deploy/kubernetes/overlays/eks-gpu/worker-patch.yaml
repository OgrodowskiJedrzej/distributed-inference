apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-vllm
  namespace: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        inference/workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: worker
          args:
            - --model
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --revision
            - 12fd25f77366fa6b3b4b768ec3050bf629380bac
            - --served-model-name
            - mock-qwen
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - float16
            - --max-model-len
            - "1024"
            - --max-num-seqs
            - "2"
            - --gpu-memory-utilization
            - "0.5"
          env:
            - name: HF_HOME
              value: /cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: STARTUP_PROBE_TIMEOUT_SECONDS
              value: "30"
          startupProbe:
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 30
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "3"
              memory: 12Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
