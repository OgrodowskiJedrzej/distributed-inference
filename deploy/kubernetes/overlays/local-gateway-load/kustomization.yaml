apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference
resources:
  - ../../base/gateway
configMapGenerator:
  - name: inference-gateway-load-config
    files:
      - config.yaml
patches:
  - target:
      kind: Deployment
      name: inference-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inference-gateway
      spec:
        template:
          metadata:
            annotations:
              inference-lab/gateway-profile: load
          spec:
            containers:
              - name: gateway
                volumeMounts:
                  - name: gateway-load-config
                    mountPath: /app/config.yaml
                    subPath: config.yaml
                    readOnly: true
            volumes:
              - name: gateway-load-config
                configMap:
                  name: inference-gateway-load-config
