apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference
resources:
  - ../../base/gateway
configMapGenerator:
  - name: inference-gateway-config
    namespace: inference
    behavior: replace
    files:
      - config.yaml
patches:
  - target:
      kind: Deployment
      name: inference-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inference-gateway
      spec:
        template:
          metadata:
            annotations:
              inference-lab/gateway-profile: load
