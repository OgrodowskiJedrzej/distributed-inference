apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: inference-gateway:v0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: UPSTREAM_URL
              value: http://llmd-epp:8081
            - name: REDIS_ADDRESS
              value: inference-redis-master:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
