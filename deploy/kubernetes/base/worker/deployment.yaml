apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-vllm
  namespace: inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mock-vllm
  template:
    metadata:
      labels:
        app: mock-vllm
    spec:
      containers:
        - name: worker
          image: mock-vllm:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          startupProbe:
            exec:
              command:
                - python3
                - /opt/probes/startup_probe.py
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: worker-probes
              mountPath: /opt/probes
              readOnly: true
      volumes:
        - name: worker-probes
          configMap:
            name: worker-probes
