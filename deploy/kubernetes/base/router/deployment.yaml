apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      serviceAccountName: vllm-router
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: vllm/vllm-router:v0.1.16
          imagePullPolicy: IfNotPresent
          command:
            - vllm-router
          args:
            - --host
            - 0.0.0.0
            - --port
            - "30000"
            - --service-discovery
            - --selector
            - app=mock-vllm
            - --service-discovery-namespace
            - inference
            - --service-discovery-port
            - "8000"
            - --policy
            - power_of_two
            - --request-id-headers
            - x-request-id
            - --prometheus-host
            - 0.0.0.0
            - --prometheus-port
            - "29000"
            - --health-check-endpoint
            - /health
            - --health-check-interval-secs
            - "5"
          ports:
            - name: http
              containerPort: 30000
            - name: metrics
              containerPort: 29000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 30
