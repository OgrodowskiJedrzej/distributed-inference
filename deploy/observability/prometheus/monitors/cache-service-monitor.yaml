apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kv-cache
  namespace: inference
spec:
  namespaceSelector:
    matchNames:
      - inference
  selector: {}
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_service_name
          regex: kv-cache
          action: keep
