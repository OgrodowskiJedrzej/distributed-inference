apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-pipeline-experiment
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  inference-pipeline-experiment.json: |-
    {
      "uid": "inference-pipeline-experiment",
      "title": "Inference pipeline experiment",
      "version": 1,
      "schemaVersion": 41,
      "editable": true,
      "tags": [
        "inference",
        "pipeline",
        "experiment"
      ],
      "timezone": "browser",
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "prometheus",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "options": []
          },
          {
            "name": "run_id",
            "label": "Run ID",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${prometheus}"
            },
            "query": {
              "query": "label_values(pipeline_client_info{namespace=\"inference\"}, run_id)",
              "refId": "RunIDs"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "options": []
          },
          {
            "name": "worker_pod",
            "label": "Worker details",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${prometheus}"
            },
            "query": {
              "query": "label_values(vllm:num_requests_running{namespace=\"inference\",service=\"mock-vllm\"}, pod)",
              "refId": "WorkerPods"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "component",
            "label": "Log components",
            "type": "custom",
            "query": "inference-gateway,llmd-epp,mock-vllm,kv-cache,pipeline-benchmark",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "log_pod",
            "label": "Log Pods",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values({namespace=\"inference\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "request_id",
            "label": "Request ID (literal; empty = all)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Run and data quality",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 2,
          "title": "How to read this experiment",
          "type": "text",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 24,
            "h": 4
          },
          "options": {
            "mode": "markdown",
            "content": "**One run, shared wall clock.** Select its Run ID and exact time interval; the runner prints a direct link. Client series carry the run ID. Component series cover the deployment and time window, so other traffic is included.\n\nPercentiles are histogram approximations over the rate window. Missing series, undefined ratios and insufficient samples remain **No data**. Add 20 seconds after the run end when inspecting final scraped totals; raw client artifacts contain the exact final records. Worker filters affect worker-detail panels; autoscaling panels always cover all replicas."
          }
        },
        {
          "id": 3,
          "title": "Run metadata — last scraped sample in selected interval",
          "type": "table",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 16,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(pipeline_client_info{namespace=\"inference\",run_id=\"$run_id\"}[$__range])",
              "legendFormat": "",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "container": true,
                  "namespace": true,
                  "pod": true,
                  "app": true
                }
              }
            }
          ]
        },
        {
          "id": 4,
          "title": "Generator phase — last scraped",
          "type": "stat",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Initializing"
                    },
                    "1": {
                      "text": "Scheduling"
                    },
                    "2": {
                      "text": "Draining"
                    },
                    "3": {
                      "text": "Complete"
                    },
                    "4": {
                      "text": "Incomplete"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(pipeline_client_phase{namespace=\"inference\",run_id=\"$run_id\"}[$__range])",
              "legendFormat": "phase",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "title": "Scrape availability — components",
          "type": "timeseries",
          "description": "1 = successful scrape; 0 = scrape failure. An absent target is not zero and does not prove a component is healthy.",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{namespace=\"inference\",service=~\"inference-gateway|llmd-epp|mock-vllm|kv-cache\"}",
              "legendFormat": "{{service}} / {{pod}}",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "title": "Client stage and freshness",
          "type": "timeseries",
          "description": "Stage is zero-based. Missing client series after Pod removal are expected. Freshness measures the last scrape, not progress of the event loop.",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "pipeline_client_stage{namespace=\"inference\",run_id=\"$run_id\"}",
              "legendFormat": "stage (zero-based)",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "B",
              "expr": "time() - max(timestamp(pipeline_client_phase{namespace=\"inference\",run_id=\"$run_id\"}))",
              "legendFormat": "sample age (seconds)",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "title": "Load and outcomes",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 8,
          "title": "Offered, sent and completed requests/s",
          "type": "timeseries",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(pipeline_client_target_requests_per_second{namespace=\"inference\",run_id=\"$run_id\"})",
              "legendFormat": "target RPS",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum(rate(pipeline_client_scheduled_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "scheduled",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "C",
              "expr": "sum(rate(pipeline_client_sent_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "sent",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "D",
              "expr": "sum(rate(pipeline_client_completed_total{namespace=\"inference\",run_id=\"$run_id\",outcome=\"success\"}[$__rate_interval]))",
              "legendFormat": "successful",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "E",
              "expr": "sum(rate(pipeline_client_completed_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "all completed",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 9,
          "title": "Request outcomes/s — HTTP and transport",
          "type": "timeseries",
          "description": "Timeouts and cancelled/broken streams can retain HTTP 200; status 200 alone does not mean a successful generation.",
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome,http_status,reason) (rate(pipeline_client_completed_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "{{outcome}} / HTTP {{http_status}} / {{reason}}",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 10,
          "title": "Generator in-flight and unsent arrivals/s",
          "type": "timeseries",
          "description": "Client concurrency cap is 256; arrivals >100 ms late are unsent rather than replayed in a catch-up burst. Unsent arrivals are not gateway rejections.",
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(pipeline_client_in_flight{namespace=\"inference\",run_id=\"$run_id\"})",
              "legendFormat": "in-flight requests",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum by (reason) (rate(pipeline_client_unsent_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "unsent/s / {{reason}}",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 11,
          "title": "Output tokens/s and usage coverage",
          "type": "timeseries",
          "description": "Output token rate is hidden if the window has missing usage or no usage-covered successes. Usage-coverage series are requests/s, not tokens/s.",
          "gridPos": {
            "x": 12,
            "y": 25,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(pipeline_client_output_tokens_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval])) and (sum(rate(pipeline_client_usage_requests_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval])) > 0) and (sum(rate(pipeline_client_missing_usage_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval])) == 0)",
              "legendFormat": "output tokens/s — complete usage coverage",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum(rate(pipeline_client_usage_requests_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "successful requests/s with usage",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "C",
              "expr": "sum(rate(pipeline_client_missing_usage_total{namespace=\"inference\",run_id=\"$run_id\"}[$__rate_interval]))",
              "legendFormat": "successful requests/s without usage",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 12,
          "title": "Last scraped cumulative request counts",
          "type": "timeseries",
          "description": "Raw cumulative counters sampled by Prometheus, not exact artifact totals. Extend the end time by 20 seconds for the final scrape. New outcome series appear when first observed.",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(last_over_time(pipeline_client_scheduled_total{namespace=\"inference\",run_id=\"$run_id\"}[$__range]))",
              "legendFormat": "scheduled",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum(last_over_time(pipeline_client_sent_total{namespace=\"inference\",run_id=\"$run_id\"}[$__range]))",
              "legendFormat": "sent",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "C",
              "expr": "sum(last_over_time(pipeline_client_completed_total{namespace=\"inference\",run_id=\"$run_id\",outcome=\"success\"}[$__range]))",
              "legendFormat": "successful",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "D",
              "expr": "sum(last_over_time(pipeline_client_completed_total{namespace=\"inference\",run_id=\"$run_id\",outcome!=\"success\"}[$__range]))",
              "legendFormat": "failed/cancelled",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            },
            {
              "refId": "E",
              "expr": "sum(last_over_time(pipeline_client_unsent_total{namespace=\"inference\",run_id=\"$run_id\"}[$__range]))",
              "legendFormat": "unsent",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 13,
          "title": "Admission rejections/s — client response reason",
          "type": "timeseries",
          "description": "Reasons come from the gateway API error body. Unknown or malformed bodies retain the HTTP error with reason=other. No retry is performed.",
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (reason) (rate(pipeline_client_completed_total{namespace=\"inference\",run_id=\"$run_id\",http_status=\"429\"}[$__rate_interval]))",
              "legendFormat": "{{reason}}",
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "range": true
            }
          ]
        },
        {
          "id": 14,
          "title": "Client latency and generator capacity",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 39,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 15,
          "title": "Client TTFT — successful streams",
          "type": "timeseries",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
