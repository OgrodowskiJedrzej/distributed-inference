            "y": 171,
            "w": 24,
            "h": 12
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Ascending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "refId": "A",
