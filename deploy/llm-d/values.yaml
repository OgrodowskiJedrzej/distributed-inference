router:
  modelServers:
    type: vllm
    protocol: http
    matchLabels:
      app: mock-vllm
    targetPorts:
      - number: 8000
  extraServicePorts:
    - name: http
      port: 8081
      protocol: TCP
      targetPort: 8081
  inferencePool:
    failureMode: FailClose
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v1.0.0
      pullPolicy: IfNotPresent
    flags:
      v: 2
    pluginsConfigFile: routing.yaml
    pluginsCustomConfig:
      routing.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: metrics-data-source
          parameters:
            scheme: http
            path: /metrics
        - type: core-metrics-extractor
        - type: max-score-picker
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: max-score-picker
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  proxy:
    proxyType: envoy
    mode: sidecar
    failOpen: false
    image: docker.io/envoyproxy/envoy:distroless-v1.33.2
    args:
      - --service-node
      - envoy-sidecar
      - --log-level
      - warn
      - --concurrency
      - "1"
      - --drain-strategy
      - immediate
      - --drain-time-s
      - "60"
      - -c
      - /etc/envoy/envoy.yaml
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  monitoring:
    prometheus:
      enabled: false
      auth:
        enabled: false
  tracing:
    enabled: false
