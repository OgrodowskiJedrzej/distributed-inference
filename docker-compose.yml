services:
  worker-0:
    image: vllm/vllm-openai-cpu:latest-arm64
    ports:
      - "8001:8000"
    shm_size: "1gb"
    cpus: 2
    environment:
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_CPU_OMP_THREADS_BIND: nobind
      OMP_NUM_THREADS: "2"
    command:
      - Qwen/Qwen2.5-0.5B-Instruct
      - --served-model-name
      - test-model
      - --dtype
      - bfloat16
      - --max-model-len
      - "512"
      - --enforce-eager