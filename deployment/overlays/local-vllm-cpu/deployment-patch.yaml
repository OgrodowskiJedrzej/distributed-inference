apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-vllm
  namespace: inference
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: worker
          args:
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --revision
            - 12fd25f77366fa6b3b4b768ec3050bf629380bac
            - --served-model-name
            - mock-qwen
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - float32
            - --max-model-len
            - "1024"
            - --max-num-seqs
            - "2"
            - --kv-cache-memory-bytes
            - 128M
          env:
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
            - name: OMP_NUM_THREADS
              value: "4"
            - name: HF_HOME
              value: /cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: STARTUP_PROBE_TIMEOUT_SECONDS
              value: "30"
          startupProbe:
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 30
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 3Gi
          volumeMounts:
            - name: vllm-cache
              mountPath: /cache
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: vllm-cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
